workflows:
  ios-testflight:
    name: iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: apple

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meshal.locationspoofer

      vars:
        BUNDLE_ID: "com.meshal.locationspoofer"
        TEAM_ID: "FXU58JA4KB"
        XCODE_PROJECT: "PaopaoLocationSpoofer.xcodeproj"
        XCODE_SCHEME: "PaopaoLocationSpoofer"
        APP_STORE_APPLE_ID: "6802081287"

    scripts:
      - name: Install dependencies
        script: |
          brew update
          brew install xcodegen

      - name: Verify Go
        script: |
          go version

      - name: Download Go modules
        script: |
          cd Core
          go mod tidy
          go mod download

      - name: Build Go Core
        script: |
          chmod +x Scripts/build-core.sh
          ./Scripts/build-core.sh

      - name: Generate Xcode project
        script: |
          sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" project.yml || true
          sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" Config/App.xcconfig || true
          xcodegen generate

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))

      - name: Archive App
        script: |
          mkdir -p build/ios

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/app.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE="Manual" \
            archive

      - name: Export IPA
        script: |
          mkdir -p build/ios/ipa

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>locationspoofer_profile</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/app.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

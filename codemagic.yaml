workflows:
  ios-testflight:
    name: iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: apple

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meshal.locationspoofer

      vars:
        BUNDLE_ID: "com.meshal.locationspoofer"
        TEAM_ID: "FXU58JA4KB"
        XCODE_PROJECT: "PaopaoLocationSpoofer.xcodeproj"
        XCODE_SCHEME: "PaopaoLocationSpoofer"
        APP_STORE_APPLE_ID: "6802081287"

    scripts:
      - name: Install dependencies
        script: |
          brew update
          brew install xcodegen

      - name: Verify Go
        script: |
          go version

      - name: Download Go modules
        script: |
          cd Core
          go mod tidy
          go mod download

      - name: Build Go Core
        script: |
          chmod +x Scripts/build-core.sh
          ./Scripts/build-core.sh

      - name: Update Bundle Identifier everywhere and generate project
        script: |
          find . -maxdepth 3 -type f \( -name "*.yml" -o -name "*.yaml" -o -name "*.xcconfig" -o -name "*.plist" \) -exec sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" {} +
          xcodegen generate

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
ض

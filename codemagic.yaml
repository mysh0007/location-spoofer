workflows:
  ios-testflight:
    name: iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: apple

    environment:
      xcode: latest

      vars:
        BUNDLE_ID: "com.meshal.locationspoofer"
        TEAM_ID: "FXU58JA4KB"
        XCODE_PROJECT: "PaopaoLocationSpoofer.xcodeproj"
        XCODE_SCHEME: "PaopaoLocationSpoofer"
        APP_STORE_APPLE_ID: "6802081287"

    scripts:
      - name: Install dependencies
        script: |
          brew update
          brew install xcodegen

      - name: Verify Go
        script: |
          go version

      - name: Download Go modules
        script: |
          cd Core
          go mod tidy
          go mod download

      - name: Build Go Core
        script: |
          chmod +x Scripts/build-core.sh
          ./Scripts/build-core.sh

      - name: Generate Xcode project
        script: |
          sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" project.yml || true
          sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" Config/App.xcconfig || true
          xcodegen generate

      - name: Fetch signing files
        script: |
          keychain initialize

          SSH_KEY_PATH="$HOME/.ssh/id_rsa_codemagic"

          ssh-keygen -t rsa -b 2048 -f "$SSH_KEY_PATH" -N ""

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$SSH_KEY_PATH"

          keychain add-certificates

          echo "========== Installed Certificates =========="
          security find-identity -v -p codesigning

          xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))

      - name: Archive App
        script: |
          mkdir -p build/ios

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/app.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive \
            -allowProvisioningUpdates

      - name: Export IPA
        script: |
          mkdir -p build/ios/ipa

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>destination</key>
              <string>export</string>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/app.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

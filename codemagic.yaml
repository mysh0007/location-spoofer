workflows:
  ios-testflight:
    name: iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: apple

    environment:
      xcode: latest

      vars:
        BUNDLE_ID: "YOUR_BUNDLE_ID"
        XCODE_PROJECT: "PaopaoLocationSpoofer.xcodeproj"
        XCODE_SCHEME: "PaopaoLocationSpoofer"
        APP_STORE_APPLE_ID: "YOUR_APP_STORE_APPLE_ID"

    scripts:
      - name: Install dependencies
        script: |
          brew update
          brew install xcodegen

      - name: Verify Go
        script: |
          go version

      - name: Download Go modules
        script: |
          cd Core
          go mod tidy
          go mod download

      - name: Build Go Core
        script: |
          chmod +x Scripts/build-core.sh
          ./Scripts/build-core.sh

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Configure signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

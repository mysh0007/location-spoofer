workflows:
  ios-testflight:
    name: iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 120

    # يجب أن يطابق الاسم اسم مفتاح App Store Connect المحفوظ في Team integrations.
    integrations:
      app_store_connect: apple

    environment:
      # يفضّل تثبيت رقم Xcode محدد بعد اختبار المشروع بدلاً من latest لضمان
      # قابلية تكرار البناء. احتُفظ بالقيمة هنا لتجنّب تغيير سلوك مشروعك مباشرة.
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meshal.locationspoofer

      vars:
        BUNDLE_ID: "com.meshal.locationspoofer"
        TEAM_ID: "FXU58JA4KB"
        XCODE_PROJECT: "PaopaoLocationSpoofer.xcodeproj"
        XCODE_SCHEME: "PaopaoLocationSpoofer"
        APP_STORE_APPLE_ID: "6802081287"

    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          brew install xcodegen

      - name: Verify Go
        script: |
          set -e
          go version

      - name: Download Go modules
        script: |
          set -e
          cd Core
          go mod download

      - name: Build Go Core
        script: |
          set -e
          chmod +x Scripts/build-core.sh
          ./Scripts/build-core.sh

      - name: Generate Xcode project
        script: |
          set -e
          test -f project.yml || { echo "Required file not found: project.yml"; exit 1; }
          sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" project.yml
          if [ -f Config/App.xcconfig ]; then
            sed -i '' "s/com.paopaolabs.location-spoofer/$BUNDLE_ID/g" Config/App.xcconfig
          fi
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store

      - name: Increment build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          LATEST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --silent)"
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "Could not read a numeric TestFlight build number: $LATEST"
              echo "For the first upload, create the app record and set an initial build number manually."
              exit 1
              ;;
          esac
          agvtool new-version -all "$((LATEST + 1))"

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.xcarchive/dSYMs/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
